          name: Write VCF header
          command: |
            printf '##fileformat=VCFv4.2\n' > in.vcf
      - run:
          name: Build variant toolkit
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target vcf_normalize -j2
      - run:
          name: Normalize indels
          command: LIONSS_LP=1 ./build/vcf_normalize --vcf in.vcf --ref grch38

